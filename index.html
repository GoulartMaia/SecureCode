<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SecureCode – learn to break it, then fix it</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap">
<style>
:root{--bg:#eef3f1;--ink:#12262b;--mut:#506468;--card:#fff;--line:#cfdad7;--teal:#0f766e;--key:#e8a317;--bad:#c2410c;--good:#15803d;--code:#12262b;--codeink:#d7efe9}
@media (prefers-color-scheme:dark){:root{--bg:#0d1a1e;--ink:#e6f1ee;--mut:#9ab1b0;--card:#14262b;--line:#27403f;--teal:#2dd4bf;--key:#f5b83d;--bad:#fb923c;--good:#4ade80;--code:#08110f;--codeink:#c9ece4}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.1;margin:0 0 .5em}
h1{font-size:clamp(2.6rem,8vw,4.6rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:1.9rem}h3{font-size:1.2rem}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--key);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 5vw;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.logo{font:800 1.25rem "Bricolage Grotesque",sans-serif;background:none;border:0;color:var(--ink);padding:0}
.logo span{color:var(--teal)}
.keys{font-weight:700;background:var(--card);border:1px solid var(--line);padding:4px 12px;border-radius:99px}
main{max-width:860px;margin:0 auto;padding:32px 5vw 80px}
.btn{background:var(--teal);color:#fff;border:0;padding:11px 20px;border-radius:8px;font-weight:700}
.dark .btn,@media (prefers-color-scheme:dark){}
@media (prefers-color-scheme:dark){.btn{color:#04201c}}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.crumb{background:none;border:0;color:var(--teal);font-weight:700;padding:0;margin-bottom:18px}
.hero{padding:30px 0 10px}
.hero p{font-size:1.2rem;color:var(--mut);max-width:34em}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin:26px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
.card.theme{text-align:left;color:var(--ink);cursor:pointer;border-left:8px solid var(--teal)}
.card.theme:hover{border-color:var(--key)}
.card.theme:nth-child(2){border-left-color:var(--key)}
.how{display:flex;gap:14px;flex-wrap:wrap;color:var(--mut)}
.how div{flex:1 1 200px}.how b{color:var(--ink);display:block}
.path{list-style:none;padding:0;margin:20px 0;border-left:4px solid var(--line);margin-left:14px}
.path li{position:relative;margin:0 0 14px 26px}
.path li::before{content:"";position:absolute;left:-36px;top:18px;width:16px;height:16px;border-radius:50%;background:var(--line);border:3px solid var(--bg)}
.path li.done::before{background:var(--good)}.path li.open::before{background:var(--key)}
.node{width:100%;display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;color:var(--ink)}
.node[disabled]{opacity:.55;cursor:not-allowed}
.node small{display:block;color:var(--mut)}
.tag{margin-left:auto;font-size:.8rem;color:var(--mut)}
.soon{color:var(--mut);font-style:italic}
pre,.code{background:var(--code);color:var(--codeink);padding:14px 16px;border-radius:10px;font:15px/1.5 ui-monospace,Menlo,Consolas,monospace;overflow-x:auto;white-space:pre-wrap;word-break:break-word;margin:12px 0}
.code mark{background:var(--bad);color:#fff;border-radius:3px;padding:0 3px}
.diary{background:#fdf6dc;color:#3a2f10;border:1px solid #e3d08a;border-radius:12px;padding:20px;max-width:420px;box-shadow:4px 6px 0 #e3d08a;transform:rotate(-1deg);margin:18px 0}
.diary b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.2rem}
label{display:block;font-weight:600;margin:10px 0 4px}
input[type=text],input[type=password]{width:100%;max-width:420px;padding:10px 12px;font:16px ui-monospace,Menlo,monospace;border:2px solid var(--line);border-radius:8px;background:#fff;color:#12262b}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.msg{margin-top:14px;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card)}
.msg.good{border-color:var(--good)}.msg.bad{border-color:var(--bad)}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.opt:hover{border-color:var(--teal)}
.tries span{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--line);margin-right:6px}
.tries span.used{background:var(--bad)}
.switch{display:inline-flex;border:2px solid var(--line);border-radius:99px;overflow:hidden}
.switch button{border:0;padding:6px 14px;background:transparent;color:var(--ink);font-weight:600}
.switch button.on{background:var(--teal);color:#fff}
@media (prefers-color-scheme:dark){.switch button.on{color:#04201c}}
footer{text-align:center;color:var(--mut);font-size:.9rem;padding:20px}
@media (prefers-reduced-motion:no-preference){.diary{transition:transform .2s}.diary:hover{transform:rotate(0)}}
.timer{font-weight:700;background:var(--card);border:1px solid var(--line);padding:4px 12px;border-radius:99px;font-variant-numeric:tabular-nums}
.timer.low{border-color:var(--bad);color:var(--bad)}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.help{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
.bubble{padding:9px 13px;border-radius:10px;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--card);border:1px solid var(--line)}
.bubble.me{margin-left:12%;border-color:var(--teal)}
.chatrow{display:flex;gap:8px;margin-top:10px}.chatrow input{max-width:none;flex:1;min-width:0}
.line{display:block;width:100%;text-align:left;background:transparent;border:0;color:inherit;font:inherit;padding:1px 6px;border-radius:4px;white-space:pre-wrap;overflow-wrap:anywhere}
.line:hover:not(:disabled){background:rgba(255,255,255,.14)}.line.sel{background:var(--key);color:#12262b}.line:disabled{cursor:default}
pre.lines{padding:10px 8px}
.opt.sel{border-color:var(--teal);border-width:3px}.opt:disabled{cursor:default}
details{margin:12px 0}summary{cursor:pointer;font-weight:700}
.muted{color:var(--mut)}
.tbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}.tab{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-weight:600}
.tab.on{background:var(--teal);color:#fff;border-color:var(--teal)}.tab:disabled{opacity:.45;cursor:not-allowed}#texit{margin-left:auto}
.split{display:grid;grid-template-columns:1fr 1fr}.split section{min-width:0;border-right:1px solid var(--line)}.split h3{margin:0;padding:8px 16px;border-bottom:1px solid var(--line)}
.split iframe{display:block;width:100%;height:calc(100vh - 170px);min-height:420px;border:0}
body.teacher main{max-width:none;padding:0}body.teacher footer{display:none}
body.preview header{display:none}body.preview footer{display:none}body.preview main{padding:16px 16px 40px}
@media (prefers-color-scheme:dark){.tab.on{color:#04201c}}
@media (max-width:900px){.split{grid-template-columns:1fr}.split section{border-right:0}.split iframe{height:80vh}}
</style>
</head>
<body>
<header>
  <button class="logo" onclick="go('home')" aria-label="SecureCode home">Secure<span>Code</span></button>
  <div class="keys" title="Your points">⭐ <span id="pts">0</span></div>
</header>
<main id="app"></main>
<footer>SecureCode · everything runs in a simulation, no real database is touched.</footer>

<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/level1.js"></script>
<script src="js/level2.js"></script>
<script src="js/level3.js"></script>
<script src="js/level4.js"></script>
<script>start();</script>
</body>
</html>
