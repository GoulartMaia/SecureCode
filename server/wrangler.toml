[vars]
ALLOWED_ORIGIN = "https://goulartmaia.github.io"
ASSIGN_ROUND = "round-2"
# MODEL = "@cf/google/gemma-4-26b-a4b-it"   # uncomment and change to use another model

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "LOGS"
id = "b7cd7d3e3d134c418a31777c552049a7"

[[durable_objects.bindings]]
